name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: splendid_kepler_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, intl, zip
          coverage: none

      - name: Prepare Backend Environment & JWT Keys
        run: |
          cd backend
          cp .env.example .env
          sed -i 's|DATABASE_URL=.*|DATABASE_URL="mysql://root:root@127.0.0.1:3306/splendid_kepler_test?serverVersion=8.0.32\&charset=utf8mb4"|' .env
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -passout pass:CHANGE_ME_JWT_PASSPHRASE 4096
          openssl rsa -pubout -in config/jwt/private.pem -passin pass:CHANGE_ME_JWT_PASSPHRASE -out config/jwt/public.pem

      - name: Install PHP Dependencies
        env:
          APP_ENV: test
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/splendid_kepler_test?serverVersion=8.0.32&charset=utf8mb4"
        run: |
          cd backend
          composer install --no-progress --prefer-dist

      - name: Create Database Schema
        env:
          APP_ENV: test
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/splendid_kepler_test?serverVersion=8.0.32&charset=utf8mb4"
        run: |
          cd backend
          php bin/console doctrine:database:create --if-not-exists --no-interaction --env=test
          php bin/console doctrine:schema:create --no-interaction --env=test

      - name: Execute PHPUnit Tests
        env:
          APP_ENV: test
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/splendid_kepler_test?serverVersion=8.0.32&charset=utf8mb4"
        run: |
          cd backend
          php vendor/bin/phpunit --display-errors --display-warnings --display-notices

  mobile-tests:
    name: Mobile Flutter Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd mobile
          flutter analyze --no-fatal-infos

      - name: Test Widget Initialization
        run: cd mobile && flutter test test/widget_test.dart

      - name: Test Realtime Service
        run: cd mobile && flutter test test/realtime_test.dart

      - name: Test SLA Widgets
        run: cd mobile && flutter test test/sla_widget_test.dart

      - name: Test Notification Badge
        run: cd mobile && flutter test test/notification_badge_test.dart

      - name: Test Reports Screen
        run: cd mobile && flutter test test/reports_screen_test.dart

      - name: Test Settings and Auth
        run: cd mobile && flutter test test/settings_and_auth_test.dart

      - name: Test Ticket Detail and AI
        run: cd mobile && flutter test test/ticket_detail_ai_test.dart
