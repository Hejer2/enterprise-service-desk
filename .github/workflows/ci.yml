name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: splendid_kepler_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, intl, zip
          coverage: none

      - name: Install PHP Dependencies
        run: |
          cd backend
          composer install --no-progress --prefer-dist

      - name: Run Doctrine Migrations
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/splendid_kepler_test?serverVersion=8.0.32&charset=utf8mb4"
        run: |
          cd backend
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Execute PHPUnit Tests
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/splendid_kepler_test?serverVersion=8.0.32&charset=utf8mb4"
        run: |
          cd backend
          php bin/phpunit

  mobile-tests:
    name: Mobile Flutter Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd mobile
          flutter analyze

      - name: Execute Flutter Tests
        run: |
          cd mobile
          flutter test
